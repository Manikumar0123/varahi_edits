# ============================================================
# VARAHI EDITS - Application Configuration
# ============================================================

# Server
server.port=${PORT:8080}

# ============================================================
# Database (PostgreSQL - Supabase)
# ============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Email (Gmail SMTP)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=varahiedits@gmail.com
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.profiles.active=default

# Business Email
app.email.business=varahiedits@gmail.com
app.email.from=varahiedits@gmail.com

# ============================================================
# JWT
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ============================================================
# Admin
# ============================================================
app.admin.username=admin
app.admin.password=${ADMIN_PASSWORD}

# ============================================================
# Twilio
# ============================================================
twilio.account.sid=${TWILIO_SID}
twilio.auth.token=${TWILIO_TOKEN}

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500

# Logging
logging.level.com.varahiedits=INFO
spring.mvc.converters.preferred-json-mapper=jackson

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB